services:
  - type: web
    name: farmproof
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    # The disk is only mounted at run time, so the first start loads the shared season.
    startCommand: npm run season -- --if-empty && npm start
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_WORKSPACE_PLAN_ID
        sync: false
      - key: DATABASE_URL
        value: file:data/farmproof.db
      - key: CHALLENGE_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Gemini on Vertex through the token bridge. If it can't be reached, claims wait for the
      # field officer. Check it at /api/health/ai.
      - key: AI_PROVIDER
        value: vertex
      - key: GOOGLE_VERTEX_PROJECT
        value: freshfly-indraai
      - key: GOOGLE_TOKEN_BRIDGE_URL
        value: https://indra-google-token-bridge-885628289254.asia-south1.run.app
      - key: GOOGLE_TOKEN_BRIDGE_SECRET
        sync: false
      - key: SANDBOX_TOOLS
        value: "true"
      # Log in with PayPal returns here; add the same URL plus /api/auth/paypal/callback to the PayPal app.
      - key: APP_URL
        value: https://farmproof-2y11.onrender.com
      - key: AG_STUDIO
        sync: false
      - key: SANDBOX_BUYER_EMAIL
        sync: false
      # Shown to evaluators beside the PayPal button and the farmer sign-in (SANDBOX_TOOLS only).
      - key: SANDBOX_BUYER_PASSWORD
        sync: false
      - key: SANDBOX_FARMER_EMAIL
        sync: false
      - key: SANDBOX_FARMER_PASSWORD
        sync: false
      - key: SANDBOX_FARMER_2_EMAIL
        sync: false
      - key: SANDBOX_DEALER_EMAIL
        sync: false
      - key: SANDBOX_LABOUR_EMAIL
        sync: false
      - key: SANDBOX_MACHINERY_EMAIL
        sync: false
      # Optional: live land checks for farms mapped on the hosted site.
      - key: GFW_API_KEY
        sync: false
      # Optional: Sentinel-2 views of each farm from the Copernicus Data Space.
      - key: SENTINEL_CLIENT_ID
        sync: false
      - key: SENTINEL_CLIENT_SECRET
        sync: false

  # Payment recovery runs while someone has the app open (see /api/sse); these two run on a clock.
  - type: cron
    name: farmproof-reconcile
    runtime: node
    region: frankfurt
    schedule: "0 3 * * *"
    buildCommand: "true"
    startCommand: 'curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reconcile"'
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: farmproof
          envVarKey: CRON_SECRET
      - key: APP_URL
        sync: false

  - type: cron
    name: farmproof-authorizations
    runtime: node
    region: frankfurt
    schedule: "0 6 * * *"
    buildCommand: "true"
    startCommand: 'curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/authorizations"'
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: farmproof
          envVarKey: CRON_SECRET
      - key: APP_URL
        sync: false
