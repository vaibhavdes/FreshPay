name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          PAYPAL_CLIENT_ID: ci-placeholder
          PAYPAL_SECRET: ci-placeholder
          CHALLENGE_SECRET: ci-placeholder-challenge-secret-0123456789
          DATABASE_URL: file:ci.db
